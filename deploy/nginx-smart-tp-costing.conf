# Smart TP Costing — Nginx Reverse Proxy Config
# Deploy to VPS: /etc/nginx/sites-available/smart-tp-costing.conf

# Redirect HTTP to HTTPS (uncomment after SSL cert is set up)
# server {
#     listen 80;
#     server_name madison88.online smarttp.madison88.online;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name madison88.online smarttp.madison88.online 5.223.78.194;

    # Health check (for monitoring)
    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Application proxy
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket support (for hot reload / notifications)
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API timeout for long operations
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
