name: Smart TP Costing CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Advisory dependency audit, and deliberately a job of its own. As a step inside
  # `verify` it short-circuited the gate: a high advisory fails the step, and every
  # step after it — including `npm run verify`, the actual lint/typecheck/test/build
  # contract — was skipped, so the suite ran nowhere but a developer's machine while
  # the check still showed red. It must stay visible and must stay failing until the
  # dependency decision is made, so there is no `continue-on-error` and no condition:
  # it reports on its own line, and nothing downstream depends on it.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report high-severity dependency advisories (advisory, not a gate)
        run: npm audit --omit=dev --audit-level=high

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ops scripts run only on the VPS, where a syntax error is discovered at
      # 02:00 by a cron job that silently fails. Parse them here instead. The
      # backup script's behavior is covered by tests/backup-script.test.ts.
      - name: Syntax-check deploy and ops scripts
        run: |
          for script in deploy/*.sh scripts/*.sh; do
            # Parse each script with the interpreter its shebang declares. `sh -n`
            # on a `#!/usr/bin/env bash` script is not a weaker check, it is the
            # wrong one: dash rejects valid bash (arrays, `set -o pipefail`) and
            # would accept constructs bash refuses. deploy/sync-to-vps.sh is
            # invoked as `bash deploy/sync-to-vps.sh` (docs/deployment.md), and
            # this step reported a syntax error in a script that runs correctly.
            # sh-declared scripts are still checked as POSIX sh, which is how
            # the VPS cron jobs and rollout actually invoke them.
            case "$(head -n 1 "$script")" in
              *bash*) checker="bash -n" ;;
              *) checker="sh -n" ;;
            esac
            echo "$checker $script"
            $checker "$script"
          done
      # The full gate: lint -> typecheck -> tests -> production build.
      # Mirrors the local `npm run verify` contract exactly.
      - run: npm run verify
        env:
          TP_COSTING_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXTGEN_BASE_URL: https://nextgen.invalid
          NEXTGEN_USERNAME: ci-placeholder
          NEXTGEN_PASSWORD: ci-placeholder

  # Replays the hostile-param fuzz harness against a real Postgres + PostgREST
  # + the app, so regressions like the status-filter hang (a raw value reaching
  # PostgREST filter grammar) are caught on every PR — not just by the static
  # guard and unit tests. The static choke-point guard (pgrest-chokepoint.test)
  # catches the source pattern deterministically; this job catches platform-
  # level behavior (PostgREST hangs/5xx) that only a live boot can prove.
  # scripts/ci-fuzz-boot.sh stands up the stack: Postgres service below,
  # PostgREST binary (runner-side), a /rest/v1 prefix proxy, the app dev
  # server, then runs the harness as unauthenticated + pbd + admin.
  # The image must be pgvector-enabled: the schema declares
  # `historical_costings.embedding vector(1536)` and production runs Supabase
  # (pgvector available), so plain postgres fails the schema load.
  fuzz-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install psql and fetch PostgREST
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client xz-utils
          curl -fsSL -o /tmp/postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v14.17/postgrest-v14.17-linux-static-x86-64.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          chmod +x /tmp/postgrest
      - name: Boot stack and replay hostile-param fuzz (anon + pbd + admin)
        run: bash scripts/ci-fuzz-boot.sh
        env:
          POSTGREST_BIN: /tmp/postgrest
          TP_COSTING_SESSION_SECRET: ci-fuzz-session-secret-at-least-32-characters
          DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
